
name: Gestaltslop - Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Xcode project
        run: |
          echo "Checking Gestaltslop project"
          xcodebuild -list -project mond.xcodeproj
